<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate · School of Communicators</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #eef2f8; font-family: system-ui, sans-serif; color: #0b2a5b; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; }
.bar button { background: #143d78; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 15px; }
.bar button.s { background: #e8f0fe; color: #0b2a5b; }
#msg { padding: 0 12px; color: #b42318; }
#note { padding: 0 12px 8px; color: #5b6785; font-size: 14px; }
#wrap { padding: 0 12px 24px; display: none; }
#cv { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 2px 10px #0003; }
</style>
</head>
<body>

<div class="bar">
  <button class="s" id="backBtn">Back</button>
  <button id="pdfBtn">Download PDF</button>
  <button id="imgBtn" class="s">Download image</button>
</div>
<p id="msg"></p>
<p id="note">To print: download the PDF, open it and print it from the PDF viewer (A4, landscape).</p>
<div id="wrap"><canvas id="cv" width="3508" height="2480"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="core.js"></script>
<script src="audio.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="student2.js"></script>
<script src="admin.js"></script>
<script src="review.js"></script>
<script src="results.js"></script>
<script src="features.js"></script>
<script src="finance.js"></script>
<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const K = kit(ctx);
let REC = null;

function content(e) {
  const type = e.certType || "achievement";
  const topic = (e.topic || "").trim();
  const score = "with a score of " + e.pct + "%";
  if (type === "class") return { title: "Certificate of Class Completion", intro: "has successfully completed the class", subject: topic || "English Class", extra: score };
  if (type === "level") return { title: "Certificate of Level Completion", intro: "has successfully completed the", subject: (LEVELS[e.level] || "English") + " Level", extra: "of the English course, " + score };
  if (type === "course") return { title: "Certificate of Course Completion", intro: "has successfully completed the", subject: "English Course", extra: "at School of Communicators" };
  return { title: "Certificate of Achievement", intro: topic ? "has successfully passed the test on" : "has successfully passed", subject: topic || "English Test", extra: score };
}

function draw(e) {
  const c = content(e);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 28; ctx.strokeRect(80, 80, W - 160, H - 160);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 6; ctx.strokeRect(150, 150, W - 300, H - 300);
  ctx.fillStyle = BLUE;
  [[150, 150], [W - 150, 150], [150, H - 150], [W - 150, H - 150]].forEach(p => ctx.fillRect(p[0] - 22, p[1] - 22, 44, 44));

  K.spaced("SCHOOL OF COMMUNICATORS", W / 2, 400, 58, 16, BLUE);
  K.fitted(c.title, W / 2, 690, 2800, 210, "bold", "normal", SERIF, NAVY);
  ctx.fillStyle = BLUE; ctx.fillRect(W / 2 - 200, 780, 400, 10);

  K.put("This certifies that", W / 2, 990, 68, { color: GREY });
  K.fitted(e.name, W / 2, 1270, 2700, 230, "normal", "italic", SERIF, NAVY);
  ctx.fillStyle = "#c9d3e6"; ctx.fillRect(W / 2 - 1150, 1345, 2300, 4);

  K.put(c.intro, W / 2, 1510, 68, { color: GREY });
  K.fitted(c.subject, W / 2, 1770, 2800, 150, "bold", "normal", SERIF, NAVY);
  K.put(c.extra, W / 2, 1945, 76, { color: BLUE });

  ctx.fillStyle = NAVY;
  ctx.fillRect(420, 2120, 800, 5); ctx.fillRect(W - 1220, 2120, 800, 5);
  K.put(fmtLong(e.when), 820, 2200, 62, { weight: "bold" });
  K.put("Date", 820, 2275, 44, { color: GREY });
  K.put(SIGNER, W - 820, 2200, 62, { weight: "bold" });
  K.put("Authorized signature", W - 820, 2275, 44, { color: GREY });

  ctx.strokeStyle = BLUE; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(W / 2, 2150, 120, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, 2150, 100, 0, Math.PI * 2); ctx.stroke();
  K.put("SC", W / 2, 2182, 90, { weight: "bold", family: SERIF, color: BLUE });

  /* discreet private code */
  K.put("No. " + e.number + "   ·   Code " + e.code, W / 2, 2308, 30, { color: "#9aa6bf" });
}

const fileBase = () => "Certificate - " + safeName(REC ? REC.name : "");
document.getElementById("pdfBtn").onclick = () => savePdf(cv, "a4", 297, 210, fileBase());
document.getElementById("imgBtn").onclick = () => savePng(cv, fileBase());

(async function () {
  const msg = document.getElementById("msg");
  try {
    S.store = await createFirebaseStore(FIREBASE_CONFIG);
    const session = await S.store.init();
    if (!session) { location.href = "index.html"; return; }
    document.getElementById("backBtn").onclick = () => { location.href = session.role === "admin" ? "index.html?tests=1" : "perfil.html"; };
    const id = new URLSearchParams(location.search).get("id");
    const rec = id ? await getDocData("certificados", id) : null;
    if (!rec || rec.passed === false || rec.certType === "none") { msg.textContent = "This certificate is not available."; return; }
    REC = rec;
    draw(rec);
    document.getElementById("wrap").style.display = "block";
  } catch (err) {
    msg.textContent = "Could not load the certificate: " + (err.code || err.message);
  }
})();
</script>
</body>
</html>
