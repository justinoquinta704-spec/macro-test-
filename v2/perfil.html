<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Macro Test Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>MY PROFILE</h1>
  <p>Your account</p>
</header>

<div class="container">
  <div class="card">
    <h2 id="who">Loading…</h2>
    <p id="lvl" class="muted"></p>
    <div class="row">
      <button onclick="location.href='dashboard.html'">Dashboard</button>
      <button class="secondary" onclick="location.href='home.html'">Home</button>
      <button class="secondary" onclick="location.href='index.html?tests=1'">Tests</button>
      <button class="secondary" id="outBtn">Log out</button>
    </div>
    <p id="msg" class="msg" role="alert"></p>
  </div>
</div>

<script src="core.js"></script>
<script src="audio.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="student2.js"></script>
<script src="admin.js"></script>
<script src="review.js"></script>
<script src="results.js"></script>
<script src="features.js"></script>
<script>
(async function () {
  try {
    S.store = await createFirebaseStore(FIREBASE_CONFIG);
    const session = await S.store.init();
    if (!session) { location.href = "index.html"; return; }
    if (session.role === "admin") { location.href = "home.html"; return; }
    document.getElementById("who").textContent = session.username;
    document.getElementById("lvl").textContent = (LEVELS[session.level] || "") + " level";
    document.getElementById("outBtn").onclick = async () => {
      await S.store.logout();
      location.href = "index.html";
    };
  } catch (e) {
    document.getElementById("msg").textContent = "Could not load your profile: " + e.message;
  }
})();
</script>
</body>
</html>
