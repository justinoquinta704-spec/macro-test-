<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Macro Test Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>MY PROFILE</h1>
  <p>Your account</p>
</header>

<div class="container">
  <div class="card">
    <h2 id="who">Loading…</h2>
    <p id="lvl" class="muted"></p>
    <div class="row">
      <button onclick="location.href='dashboard.html'">Dashboard</button>
      <button class="secondary" onclick="location.href='home.html'">Home</button>
      <button class="secondary" onclick="location.href='index.html?tests=1'">Tests</button>
      <button class="secondary" id="outBtn">Log out</button>
    </div>
    <p id="msg" class="msg" role="alert"></p>
  </div>

  <div class="card">
    <h3>My certificates</h3>
    <div id="myCerts"><p class="muted">Loading…</p></div>
  </div>

  <div class="card">
    <h3>My receipts</h3>
    <div id="myRecs"><p class="muted">Loading…</p></div>
  </div>
</div>

<script src="core.js"></script>
<script src="audio.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="student2.js"></script>
<script src="admin.js"></script>
<script src="review.js"></script>
<script src="results.js"></script>
<script src="features.js"></script>
<script src="finance.js"></script>
<script>
const btn = href => `<a href="${href}" style="display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;background:#143d78;color:#fff;text-decoration:none;font-size:14px">Open</a>`;
(async function () {
  try {
    S.store = await createFirebaseStore(FIREBASE_CONFIG);
    const session = await S.store.init();
    if (!session) { location.href = "index.html"; return; }
    if (session.role === "admin") { location.href = "home.html"; return; }
    document.getElementById("who").textContent = session.username;
    document.getElementById("lvl").textContent = (LEVELS[session.level] || "") + " level";
    document.getElementById("outBtn").onclick = async () => {
      await S.store.logout();
      location.href = "index.html";
    };

    const certs = (await listDocs("certificados", session.uid)).filter(c => c.passed !== false && c.certType !== "none")
      .sort((a, b) => b.when - a.when);
    document.getElementById("myCerts").innerHTML = certs.length ? certs.map(c => `
      <div class="question">
        <div class="row" style="justify-content:space-between"><b>${esc((CERT_LABEL[c.certType] || "Certificate") + (c.topic ? " · " + c.topic : ""))}</b><span class="muted">${esc(c.number)}</span></div>
        <p class="muted" style="margin:6px 0 0">${esc(fmtDay(c.when))} · ${esc(c.pct)}%</p>
        ${btn("certificado.html?id=" + encodeURIComponent(c.id))}
      </div>`).join("") : "<p class='muted'>No certificates yet. They appear here after you pass a test.</p>";

    const recs = (await listDocs("pagamentos", session.uid)).sort((a, b) => b.paidOn - a.paidOn);
    document.getElementById("myRecs").innerHTML = recs.length ? recs.map(p => `
      <div class="question">
        <div class="row" style="justify-content:space-between"><b>${esc(periodLabel(p.startMonth, p.months))}</b><span class="muted">${esc(p.number)}</span></div>
        <p class="muted" style="margin:6px 0 0">${esc(fmtMoney(p.amount, p.currency))} · ${esc(fmtDay(p.paidOn))} · ${esc(p.method)}</p>
        ${btn("recibo.html?id=" + encodeURIComponent(p.id))}
      </div>`).join("") : "<p class='muted'>No receipts yet.</p>";
  } catch (e) {
    document.getElementById("msg").textContent = "Could not load your profile: " + (e.code || e.message);
  }
})();
</script>
</body>
</html>
